<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Anti-flash : applique le thème AVANT le premier rendu.
         Doit rester synchronisé avec STORAGE_KEY de src/hooks/useTheme.js -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pheu_theme')
          if (stored !== 'light' && stored !== 'dark') {
            stored = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          }
          if (stored === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {
          /* localStorage indisponible — thème sombre par défaut */
        }
      })()
    </script>

    <!-- Fond de page peint dès la première image, avant même les styles du bundle -->
    <style>
      html { background-color: #08111f; }
      html[data-theme="light"] { background-color: #f8f9fc; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de Phanuel DAVODOUN — Développeur Web Full Stack basé au Bénin." />

    <!-- Open Graph / partage réseaux sociaux -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Portfolio — Phanuel DAVODOUN" />
    <meta property="og:description" content="Portfolio de Phanuel DAVODOUN — Développeur Web Full Stack basé au Bénin." />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Portfolio — Phanuel DAVODOUN" />
    <meta name="twitter:description" content="Portfolio de Phanuel DAVODOUN — Développeur Web Full Stack basé au Bénin." />

    <!-- Polices Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Portfolio — Phanuel DAVODOUN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
